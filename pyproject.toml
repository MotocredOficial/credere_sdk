[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credere-sdk"
version = "0.2.1"
description = "Python SDK for the Credere credit simulation API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "math-s", email = "matheus.andrade1996@gmail.com" },
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "diff-cover>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/credere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["credere"]
branch = true
omit = [
    "src/credere/__init__.py",
    "src/credere/models/__init__.py",
    "src/credere/resources/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"
